<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="bubble-container">
    <div id="bubble">
      <div id="bubble-header">
        <span id="bubble-tag">Socratic Nudge</span>
      </div>
      <div id="bubble-text"></div>
      <div class="actions" id="actions">
        <button id="helpBtn">Help me understand</button>
        <button id="dismissBtn" class="secondary">I've got it</button>
      </div>
    </div>
  </div>
  <div id="mascot-container">
    <img id="mascot" src="../media/mascot-idle.png" alt="companion" />
  </div>
  <script src="renderer.js"></script>
</body>
</html>
